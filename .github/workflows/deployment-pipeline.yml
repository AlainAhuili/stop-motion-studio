# Deployment pipeline (Dave Farley, Continuous Delivery).
# One release candidate is built in the commit stage. Every later stage deploys that
# same artifact with the same scripts/deploy.sh. Only config.json differs per environment.
name: deployment-pipeline

on:
  push:
    branches: [main]
  pull_request:          # short-lived PRs get commit-stage feedback only
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.13   # same Emscripten as local builds

jobs:
  commit-stage:
    name: Commit stage (< 5 min)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: C++ unit tests (native)
        run: npm run core:test
      - uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Build the C++ core to WebAssembly
        run: |
          if [ ! -d ~/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          source ~/emsdk/emsdk_env.sh
          npm run core:wasm
      - run: npm run typecheck
      - run: npm run test:unit   # the TypeScript domain tests, now running on the WebAssembly core
      - run: npm run build
      - run: node scripts/package-artifact.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: artifact/
          retention-days: 30

  acceptance-stage:
    name: Acceptance stage
    needs: commit-stage
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7   # test code and deploy scripts only, never rebuilt
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: 'release-candidate-${{ github.sha }}', path: artifact }
      - run: bash scripts/deploy.sh acceptance artifact deployments/acceptance
      - run: node scripts/serve.mjs deployments/acceptance 4173 &
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
        env: { BASE_URL: 'http://localhost:4173' }

  performance-stage:
    name: Performance stage
    needs: acceptance-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: 'release-candidate-${{ github.sha }}', path: artifact }
      - run: bash scripts/deploy.sh performance artifact deployments/performance
      - run: node scripts/serve.mjs deployments/performance 4174 &
      - run: npx playwright install --with-deps chromium
      - run: npm run test:perf
        env: { BASE_URL: 'http://localhost:4174' }

  production:
    name: Release to production
    needs: performance-stage
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment: releasing is a business decision.
    environment:
      name: production
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: 'release-candidate-${{ github.sha }}', path: artifact }
      - run: bash scripts/deploy.sh production artifact deployments/production
      # One name per attempt, so re-running this job never finds several "github-pages" artifacts.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: deployments/production
          name: github-pages-${{ github.run_attempt }}
      - id: pages
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
